<!DOCTYPE html>
<html>

<head>
<title>Library Management</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="header">
<h2>Online Library Management</h2>
</div>

<div class="container">

<div class="card">

<h3>Add Book</h3>

<input type="text" id="title" placeholder="Title">

<input type="text" id="author" placeholder="Author">

<input type="text" id="category" placeholder="Genre">

<input type="number" id="year" placeholder="Published Year">

<select id="status">
<option value="Available">Available</option>
<option value="Issued">Issued</option>
</select>

<button onclick="addBook()">Add Book</button>

</div>

<div class="card">

<h3>Search</h3>

<input type="text" id="searchTitle" placeholder="Search by Title">

<button onclick="searchBook()">Search</button>

<select id="filterStatus" onchange="filterBooks()">
<option value="">All</option>
<option value="Available">Available</option>
<option value="Issued">Issued</option>
</select>

</div>

<div class="card">

<h3>Book List</h3>

<table>

<thead>
<tr>
<th>ID</th>
<th>Title</th>
<th>Author</th>
<th>Category</th>
<th>Year</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="bookTable"></tbody>

</table>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
